# journal.leyanwc.xyz — L2 个人日记（React SPA + FastAPI）
# 注意：此 server 块没有 auth_basic —— 边界在 API 层（sessions + can_write），
#       SPA 壳是公开的（不含任何数据，见 ③ 路由表）。

# 限流（⑥ 安全清单：访客口令/恢复码接口必须防爆破）
limit_req_zone $binary_remote_addr zone=journal_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=journal_recover:10m rate=5r/h;

server {
    listen 80;
    listen [::]:80;
    server_name journal.leyanwc.xyz;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name journal.leyanwc.xyz;

    root /var/www/journal;
    index index.html;

    # TLS（certbot --nginx 自动填写）
    # ssl_certificate     /etc/letsencrypt/live/journal.leyanwc.xyz/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/journal.leyanwc.xyz/privkey.pem;

    server_tokens off;

    # 私密内容：不索引、不缓存
    add_header X-Robots-Tag  "noindex, nofollow" always;
    add_header Cache-Control "private, no-store"  always;

    # ── API 反代（FastAPI 只监听 127.0.0.1:8000）──
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 会话 cookie 透传（__Host-sid 不走 Domain，天然限本域）
        proxy_set_header Cookie $http_cookie;

        # 防超时：FastAPI 个别请求涉及 KDF/轮换，放宽一点
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        client_max_body_size 20m;   # 日记正文加密后一般 < 1MB，留余量
    }

    # 口令接口单独限流（防爆破，⑥ 清单）
    location = /api/session {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        limit_req zone=journal_login burst=3 nodelay;
    }

    # 恢复码接口更严（5 次/小时/IP，⑩ Q1a）
    location = /api/auth/recover {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        limit_req zone=journal_recover burst=2 nodelay;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}