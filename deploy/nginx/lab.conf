# lab.leyanwc.xyz — L1 静态 demo（nginx Basic Auth）
server {
    listen 80;
    listen [::]:80;
    server_name lab.leyanwc.xyz;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name lab.leyanwc.xyz;

    root /var/www/lab;
    index index.html;

    # TLS（certbot --nginx 自动填写）
    # ssl_certificate     /etc/letsencrypt/live/lab.leyanwc.xyz/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/lab.leyanwc.xyz/privkey.pem;

    server_tokens off;

    # ── L1 门禁：server 块级，全路径覆盖 ──
    auth_basic           "Lab";
    auth_basic_user_file /etc/nginx/.htpasswd-lab;

    # 不索引、不缓存（门后内容不进搜索引擎/共享缓存）
    add_header X-Robots-Tag  "noindex, nofollow" always;
    add_header Cache-Control "private, no-store"  always;

    location / {
        try_files $uri $uri/ =404;
    }
}