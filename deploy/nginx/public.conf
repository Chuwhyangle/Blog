# leyanwc.xyz — L0 公开技术博客
# 监听 80 仅做 301 跳转；实际内容走 443
server {
    listen 80;
    listen [::]:80;
    server_name leyanwc.xyz www.leyanwc.xyz;

    # 备案号页脚通过 /sites/default 或静态文件完成（无需重定向）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 强制 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name leyanwc.xyz www.leyanwc.xyz;

    root /var/www/public;
    index index.html;

    # TLS（certbot --nginx 会自动填写证书路径）
    # ssl_certificate     /etc/letsencrypt/live/leyanwc.xyz/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/leyanwc.xyz/privkey.pem;

    # HSTS（备案域名可用）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    server_tokens off;

    # 静态资源缓存
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA 不需要，L0 是纯静态多页，直接 try_files 到文件
    location / {
        try_files $uri $uri/ =404;
    }

    # 隐藏文件一律拒绝
    location ~ /\. {
        deny all;
    }
}