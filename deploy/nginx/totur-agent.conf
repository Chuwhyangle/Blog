# totur-agent（AI 学习辅导 Agent）—— 主域 leyanwc.xyz 归属此项目
# 容器 nginx 已迁移到宿主 8443（WEB_TLS_PORT），此处由宿主 nginx 反代终结 TLS
server {
    listen 80;
    listen [::]:80;
    server_name leyanwc.xyz www.leyanwc.xyz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name leyanwc.xyz www.leyanwc.xyz;

    ssl_certificate     /etc/letsencrypt/live/leyanwc.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/leyanwc.xyz/privkey.pem;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 反代容器 nginx（它内部按 HTTPS 逻辑处理，SNI 传 leyanwc.xyz）
    location / {
        proxy_pass https://127.0.0.1:8443;
        proxy_ssl_server_name on;
        proxy_ssl_name leyanwc.xyz;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
