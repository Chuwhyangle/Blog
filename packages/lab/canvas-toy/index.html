<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canvas Toy · Lab</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #0f1117; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    canvas { border-radius: 12px; border: 1px solid #2a2e3a; cursor: crosshair; }
    .back { position: fixed; top: 20px; left: 24px; color: #6c9ef8; text-decoration: none; font-size: .85rem; }
  </style>
</head>
<body>
  <a class="back" href="../">← 返回 Lab</a>
  <canvas id="c" width="800" height="600"></canvas>
  <script>
    const cv = document.getElementById('c'), ctx = cv.getContext('2d');
    const W = cv.width, H = cv.height;
    let mouse = { x: W / 2, y: H / 2, active: false };
    const parts = Array.from({ length: 120 }, () => ({
      x: Math.random() * W, y: Math.random() * H,
      vx: (Math.random() - .5) * .6, vy: (Math.random() - .5) * .6,
      r: Math.random() * 2.2 + .6
    }));
    cv.addEventListener('mousemove', e => {
      const r = cv.getBoundingClientRect();
      mouse.x = (e.clientX - r.left) * (W / r.width);
      mouse.y = (e.clientY - r.top) * (H / r.height);
      mouse.active = true;
    });
    cv.addEventListener('mouseleave', () => mouse.active = false);
    function step() {
      ctx.fillStyle = 'rgba(15,17,23,.18)';
      ctx.fillRect(0, 0, W, H);
      for (const p of parts) {
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0 || p.x > W) p.vx *= -1;
        if (p.y < 0 || p.y > H) p.vy *= -1;
        if (mouse.active) {
          const dx = mouse.x - p.x, dy = mouse.y - p.y;
          const d2 = dx * dx + dy * dy;
          if (d2 < 25000) { p.x += dx * .002; p.y += dy * .002; }
        }
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = '#6c9ef8';
        ctx.fill();
      }
      requestAnimationFrame(step);
    }
    step();
  </script>
</body>
</html>
