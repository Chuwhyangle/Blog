<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HSL Color Picker · Lab</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #111318; color: #e6e8ee;
    }
    .card {
      background: #1a1d27; border: 1px solid #2a2e3a; border-radius: 14px;
      padding: 36px; width: min(420px, 90vw); text-align: center;
    }
    h1 { font-size: 1.2rem; margin: 0 0 20px; }
    #preview {
      width: 100%; height: 160px; border-radius: 10px; border: 1px solid #2a2e3a;
      transition: background .1s;
    }
    .sliders { margin: 24px 0 12px; text-align: left; }
    .row { display: flex; align-items: center; gap: 10px; margin: 10px 0; font-size: .85rem; }
    .row label { width: 26px; color: #9aa1ae; }
    .row input[type=range] { flex: 1; }
    .row output { width: 64px; text-align: right; font-family: ui-monospace, monospace; color: #9aa1ae; }
    #hex {
      font-family: ui-monospace, Consolas, monospace; font-size: 1.15rem;
      background: #0f1117; border: 1px solid #2a2e3a; border-radius: 8px;
      padding: 8px 14px; color: #fff; user-select: all;
    }
    .back { display: inline-block; margin-top: 18px; color: #6c9ef8; text-decoration: none; font-size: .85rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🎨 HSL Color Picker</h1>
    <div id="preview"></div>
    <div class="sliders">
      <div class="row"><label>H</label><input type="range" id="h" min="0" max="360" value="210"><output id="hv">210</output></div>
      <div class="row"><label>S</label><input type="range" id="s" min="0" max="100" value="80"><output id="sv">80%</output></div>
      <div class="row"><label>L</label><input type="range" id="l" min="0" max="100" value="50"><output id="lv">50%</output></div>
    </div>
    <div id="hex">#4DA3FF</div>
    <a class="back" href="../">← 返回 Lab</a>
  </div>
  <script>
    const h = document.getElementById('h'), s = document.getElementById('s'), l = document.getElementById('l');
    const preview = document.getElementById('preview'), hex = document.getElementById('hex');
    const hv = document.getElementById('hv'), sv = document.getElementById('sv'), lv = document.getElementById('lv');
    function render() {
      const [H, S, L] = [h.value, s.value, l.value];
      preview.style.background = `hsl(${H} ${S}% ${L}%)`;
      hv.textContent = H; sv.textContent = S + '%'; lv.textContent = L + '%';
      // HSL → 十六进制
      const c = (d) => {
        const a = S / 100 * Math.min(L / 100, 1 - L / 100);
        const f = (n) => {
          const k = (n + H / 30) % 12;
          const col = L / 100 - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
          return Math.round(col * 255).toString(16).padStart(2, '0');
        };
        return '#' + f(0) + f(8) + f(4);
      };
      hex.textContent = c().toUpperCase();
    }
    [h, s, l].forEach(el => el.addEventListener('input', render));
    render();
  </script>
</body>
</html>
